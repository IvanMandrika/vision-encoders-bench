[project]
name = "veb"
version = "0.1.0"
description = "Frozen vision encoders under distribution shift, small data budgets and vector-graphics corruptions"
requires-python = ">=3.12"
dependencies = [
    "torch==2.7.1", "torchvision==0.22.1", "transformers", "scikit-learn", "joblib", "scipy", "numpy", "pandas",
    "matplotlib", "pillow", "cairosvg", "lpips", "scikit-image", "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
